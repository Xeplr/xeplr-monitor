# Tests on every push and pull request: the API's tests (the auth catalog
# built from migrations-auth, and lib/systemd against the runner's real
# systemd — GitHub's ubuntu runners have systemd and passwordless sudo), and
# the page built, as the deploy builds it.
#
# This is an app, not an npm package: nothing is published from here. It is
# deployed with deploy/deploy.js (README: Deploy).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install the API
        working-directory: api
        run: npm ci --ignore-scripts

      - name: Test the API, with coverage
        working-directory: api
        run: |
          node --test --experimental-test-coverage \
               --test-reporter=lcov --test-reporter-destination=../coverage.info \
               --test-reporter=spec --test-reporter-destination=stdout \
               test/*.test.cjs

      - name: Build the page
        working-directory: ui
        run: npm ci --ignore-scripts && npx vite build

      - name: The deploy command starts
        run: npm ci --ignore-scripts && node deploy/deploy.js --help

      - name: Upload coverage to Codecov
        if: hashFiles('coverage.info') != ''
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
